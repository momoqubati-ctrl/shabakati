name: Program R2 — Deploy Wholesale Catalog & Pricing Migration to Production

on:
  workflow_dispatch:
    inputs:
      confirm_production:
        description: 'Type "DEPLOY-R2-PRODUCTION" to confirm execution'
        required: true
        default: ''

permissions:
  contents: read

jobs:
  deploy_r2_migration:
    name: Deploy R2 Migration via Official Supabase Management API
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          ref: deploy-only

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate Production Deployment Confirmation
        run: |
          if [ "${{ github.event.inputs.confirm_production }}" != "DEPLOY-R2-PRODUCTION" ]; then
            echo "❌ Deployment aborted: Confirmation token does not match 'DEPLOY-R2-PRODUCTION'."
            exit 1
          fi
          echo "✓ Production deployment confirmation token verified."

      - name: Verify Migration File Cryptographic Freeze
        id: file_hash
        run: |
          MIG_FILE="supabase/migrations/20260920000001_program_r2_wholesale_catalog_pricing.sql"
          if [ ! -f "$MIG_FILE" ]; then
            echo "❌ Migration file not found: $MIG_FILE"
            exit 1
          fi
          EXPECTED_SHA="179d908b67aea21843991d61b7b2ff309771f6692cf2ba942a0e79678dd1ebda"
          ACTUAL_SHA=$(sha256sum "$MIG_FILE" | awk '{print $1}')
          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "❌ SHA-256 mismatch! Expected $EXPECTED_SHA but got $ACTUAL_SHA"
            exit 1
          fi
          echo "migration_sha=$ACTUAL_SHA" >> $GITHUB_OUTPUT
          echo "✓ Migration File: $MIG_FILE"
          echo "✓ Raw-Byte Cryptographic SHA-256 Freeze Verified: $ACTUAL_SHA"

      - name: Execute Migration via Official Supabase Management API
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF || 'ymmxajugsmydoqyrvkjv' }}
        run: |
          node scripts/deploy_r2_migration_api.js

      - name: Run Production Read-Only Deep Contract Verification
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF || 'ymmxajugsmydoqyrvkjv' }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          node scripts/run_r2_production_verification.js

      - name: Upload Production Audit Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r2-production-audit-report
          path: r2_production_audit_report.json
